name: Daily email

# Started by two cron-job.org jobs via the workflow_dispatch API, not by `schedule:`,
# which GitHub can delay or skip. The request body picks the mode:
#   {"ref":"master","inputs":{"mode":"record"}}  store today's rates, no email
#   {"ref":"master","inputs":{"mode":"send"}}    the email (also stores the rates)
# A body without inputs sends the email.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: record stores the rates only; send also emails them
        type: choice
        options: [send, record]
        default: send

concurrency: daily-email

# contents: write lets the last step push the run record to the eval-data branch.
permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Runners are fresh each time, so history.json lives in the Actions cache.
      # Cache entries are immutable: save under a new key each run, restore the newest.
      # ponytail: cache can be evicted (lost history = one email without % change);
      # commit history.json to a branch instead if that matters.
      - uses: actions/cache@v6
        with:
          path: history.json
          key: history-${{ github.run_id }}
          restore-keys: history-

      - run: go run .
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.MODEL }}
          EVENT: ${{ vars.EVENT }}
          MODE: ${{ inputs.mode }}

      # The runner is deleted after the job, so the day's run record goes to the eval-data
      # branch: an orphan branch (no shared history with master) holding only the records.
      # always(): a failed send still keeps the record. Record mode writes none: nothing to do.
      - if: always()
        run: |
          [ -n "$(ls tests/results/*.json 2>/dev/null)" ] || exit 0
          mv tests/results "$RUNNER_TEMP/results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Exit code 2 means the branch doesn't exist yet; any other failure stops the step
          # rather than starting a second, unpushable history.
          if git ls-remote --exit-code --heads origin eval-data >/dev/null; then
            git fetch --depth=1 origin eval-data && git checkout -B eval-data FETCH_HEAD
          elif [ $? -eq 2 ]; then
            git checkout --orphan eval-data && git rm -rfq .
          else
            exit 1
          fi
          mkdir -p tests/results && cp "$RUNNER_TEMP"/results/*.json tests/results/
          git add -f tests/results
          git diff --cached --quiet || git commit -m "Run record $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git push origin eval-data
